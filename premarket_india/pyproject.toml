[project]
name = "alpha-edge"
version = "4.2.0"
description = "Agentic AI Pre-Market Intelligence Report Generator for Indian Stock Market"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.0",
    "yfinance>=0.2.31",
    "nsetools>=1.0.11",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "feedparser>=6.0.10",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pandas-ta>=0.3.14b1",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "jinja2>=3.1.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "tenacity>=8.2.3",
    "rich>=13.7.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60.0"]
twitter = ["tweepy>=4.14.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
